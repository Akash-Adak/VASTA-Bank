apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: vasta-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root123

            - name: MYSQL_DATABASE
              value: vasta_auth

            - name: MYSQL_USER
              value: vasta

            - name: MYSQL_PASSWORD
              value: vasta123

          ports:
            - containerPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: vasta-bank
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306