apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: vasta-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: akta2910/vasta-api-gateway:latest
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: vasta-bank
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080