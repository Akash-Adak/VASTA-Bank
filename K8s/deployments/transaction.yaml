apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction
  namespace: vasta-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction
  template:
    metadata:
      labels:
        app: transaction
    spec:
      containers:
        - name: transaction
          image: akta2910/vasta-transaction:latest
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret
          ports:
            - containerPort: 8084
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: transaction
  namespace: vasta-bank
spec:
  selector:
    app: transaction
  ports:
    - port: 8084
      targetPort: 8084