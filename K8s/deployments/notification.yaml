apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: vasta
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: akta2910/vasta-notify:latest
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret


---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: vasta
spec:
  selector:
    app: notification
  ports:
    - port: 8085
      targetPort: 8085
