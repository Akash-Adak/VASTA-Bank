apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: vasta-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: akta2910/vasta-notify:latest
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret
          ports:
            - containerPort: 8085
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: vasta-bank
spec:
  selector:
    app: notification
  ports:
    - port: 8085
      targetPort: 8085
