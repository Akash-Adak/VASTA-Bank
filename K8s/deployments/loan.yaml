apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan
  namespace: vasta-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan
  template:
    metadata:
      labels:
        app: loan
    spec:
      containers:
        - name: loan
          image: akta2910/vasta-loan:latest
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret
          ports:
            - containerPort: 8086
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: loan
  namespace: vasta-bank
spec:
  selector:
    app: loan
  ports:
    - port: 8086
      targetPort: 8086