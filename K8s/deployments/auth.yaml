apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: vasta-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: akta2910/vasta-auth:latest
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: vasta-bank
spec:
  selector:
    app: auth
  ports:
    - port: 8081
      targetPort: 8081