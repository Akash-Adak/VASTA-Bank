apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: vasta
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: akta2910/vasta-payment:latest
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret
          ports:
            - containerPort: 8089
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: vasta
spec:
  selector:
    app: payment
  ports:
    - port: 8089
      targetPort: 8089