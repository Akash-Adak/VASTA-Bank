apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: vasta-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: akta2910/vasta-user:latest
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: vasta-bank
spec:
  selector:
    app: user
  ports:
    - port: 8082
      targetPort: 8082