apiVersion: apps.kruise.io/v1beta1
kind: CloneSet
metadata:
  name: admin
  namespace: vasta
spec:
  replicas: 6

  selector:
    matchLabels:
      app: admin

  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: akta2910/vasta-admin:v1.0.3
          envFrom:
            - configMapRef:
                name: vasta-config
            - secretRef:
                name: vasta-secret
          ports:
            - name: http
            - containerPort: 8088
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

  updateStrategy:
    type: InPlaceIfPossible   # ✅ FIXED HERE

    rollingUpdate:
      partition: 4
      maxUnavailable: 1
      maxSurge: 1

---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: vasta
spec:
  selector:
    app: admin
  ports:

    - port: 8088
      targetPort: 8088