server:
  port: 8088

spring:
  application:
    name: admin
  cloud:
    loadbalancer:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/banking_system   # Use service name from Docker Compose
    username: root
    password: Akash@2003
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect


jwt:
  expiration: 3600000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka   # Eureka container name
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true
feign:
  okhttp:
    enabled: true
  httpclient:
    enabled: false

