name: CI-CD Pipeline (Docker + Kubernetes)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  # -------------------------------
  # JOB 1: BUILD & PUSH IMAGES
  # -------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: eureka-server
            image: vasta-eureka
          - service: auth-server
            image: vasta-auth
          - service: account-service
            image: vasta-account
          - service: user-service
            image: vasta-user
          - service: transaction-server
            image: vasta-transaction
          - service: notification-server
            image: vasta-notify
          - service: loan-server
            image: vasta-loan
          - service: kyc-service
            image: vasta-kyc
          - service: admin-server
            image: vasta-admin
          - service: Payment-gatway-server
            image: vasta-payment
          - service: api-gatway
            image: vasta-api-gateway
          - service: banking-frontend
            image: vasta-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        if: matrix.service != 'banking-frontend'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        if: matrix.service != 'banking-frontend'
        run: mvn -B clean package -DskipTests

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest


  # -------------------------------
  # JOB 2: DEPLOY + TEST K8S
  # -------------------------------
  deploy-and-test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # Create Kubernetes cluster
      - name: Create Kind Cluster
        uses: helm/kind-action@v1.8.0

      # Deploy everything
      - name: Apply Kubernetes YAMLs
        run: kubectl apply -f k8s/

      # Wait for system
      - name: Wait for Deployments
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment --all

      # Debug (VERY IMPORTANT)
      - name: Get Pods
        run: kubectl get pods -A

      - name: Get Services
        run: kubectl get svc -A

      - name: Describe if failed
        if: failure()
        run: kubectl describe pods -A

      - name: Logs if failed
        if: failure()
        run: kubectl logs -A --tail=50