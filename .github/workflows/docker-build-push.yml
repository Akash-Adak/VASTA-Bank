name: CI-CD Pipeline (Docker + Kubernetes)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  # -------------------------------
  # JOB 1: BUILD & PUSH IMAGES
  # -------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: eureka-server
            image: vasta-eureka
          - service: auth-server
            image: vasta-auth
          - service: account-service
            image: vasta-account
          - service: user-service
            image: vasta-user
          - service: transaction-server
            image: vasta-transaction
          - service: notification-server
            image: vasta-notify
          - service: loan-server
            image: vasta-loan
          - service: kyc-service
            image: vasta-kyc
          - service: admin-server
            image: vasta-admin
          - service: Payment-gatway-server
            image: vasta-payment
          - service: api-gatway
            image: vasta-api-gateway
          - service: banking-frontend
            image: vasta-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        if: matrix.service != 'banking-frontend'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        if: matrix.service != 'banking-frontend'
        run: mvn -B clean package -DskipTests

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest


  # -------------------------------
  # JOB 2: DEPLOY + TEST K8S
  # -------------------------------
  deploy-and-test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # Create Kubernetes cluster
      - name: Create Kind Cluster
        uses: helm/kind-action@v1.8.0

            # -------------------------------
      # STEP 1: Create Namespace FIRST
      # -------------------------------
      - name: Create Namespace
        run: |
          kubectl create namespace vasta-bank || echo "Namespace already exists"

      # -------------------------------
      # STEP 2: Apply All YAMLs
      # -------------------------------
      - name: Apply Kubernetes YAMLs
        run: |
          kubectl apply -f K8s/

      # -------------------------------
      # STEP 3: Wait for Pods to be Ready
      # -------------------------------
      - name: Wait for Pods Ready
        run: |
          echo "⏳ Waiting for pods to be ready..."

          for i in {1..30}; do
            NOT_READY=$(kubectl get pods -n vasta-bank --no-headers 2>/dev/null | grep -v Running | wc -l)

            if [ "$NOT_READY" -eq 0 ]; then
              echo "✅ All pods are running"
              break
            fi

            echo "Waiting... ($i/30)"
            kubectl get pods -n vasta-bank
            sleep 10
          done

      # -------------------------------
      # STEP 4: Ensure Deployments Ready
      # -------------------------------
      - name: Wait for Deployments
        run: |
          echo "⏳ Waiting for deployments..."

          DEPLOYS=$(kubectl get deployments -n vasta-bank -o jsonpath='{.items[*].metadata.name}')

          for deploy in $DEPLOYS; do
            echo ""
            echo "===== $deploy ====="
            kubectl rollout status deployment/$deploy -n vasta-bank --timeout=300s || exit 1
          done

          echo "✅ All deployments are ready"

      # -------------------------------
      # STEP 5: Show Cluster State (Nice Logs)
      # -------------------------------
      - name: Cluster Summary
        run: |
          echo "===== PODS ====="
          kubectl get pods -n vasta-bank -o wide

          echo "===== SERVICES ====="
          kubectl get svc -n vasta-bank

          echo "===== DEPLOYMENTS ====="
          kubectl get deploy -n vasta-bank

      # -------------------------------
      # STEP 6: Fail if Something is Broken
      # -------------------------------
      - name: Validate Pods Health
        run: |
          NOT_READY=$(kubectl get pods -n vasta-bank --no-headers | grep -v Running | wc -l)

          if [ "$NOT_READY" -gt 0 ]; then
            echo "❌ Some pods are NOT running"
            kubectl get pods -n vasta-bank
            exit 1
          else
            echo "✅ System is healthy"
          fi

      # Debug (VERY IMPORTANT)
      - name: Get Pods
        run: kubectl get pods -A -o wide

      - name: Get Services
        run: kubectl get svc -A

      - name: Describe if failed
        if: failure()
        run: kubectl describe pods -A

      - name: Logs if failed
        if: failure()
        run: |
          echo "===== DEBUG LOGS ====="

          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
            for pod in $(kubectl get pods -n $ns -o jsonpath='{.items[*].metadata.name}'); do
              echo ""
              echo "===== [$ns] $pod ====="
              kubectl logs -n $ns $pod --all-containers=true --tail=50 || true
            done
          done
