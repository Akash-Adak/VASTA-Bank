name: Build and Push Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # ---------------- BACKEND SERVICES ----------------
          - service: eureka-server
            image: vasta-eureka
          - service: auth-server
            image: vasta-auth
          - service: account-service
            image: vasta-account
          - service: user-service
            image: vasta-user
          - service: transaction-server
            image: vasta-transaction
          - service: notification-server
            image: vasta-notify
          - service: loan-server
            image: vasta-loan
          - service: kyc-service
            image: vasta-kyc
          - service: admin-server
            image: vasta-admin
          - service: Payment-gatway-server
            image: vasta-payment
          - service: Api-gatway-server
            image: vasta-api-gateway

          # ---------------- FRONTEND ----------------
          - service: banking-frontend
            image: vasta-frontend

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup JDK (only needed for backend)
      - name: Set up JDK 17
        if: matrix.service != 'banking-frontend'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # Step 3: Build backend services (skip for frontend)
      - name: Build with Maven
        if: matrix.service != 'banking-frontend'
        run: mvn -B clean package -DskipTests

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 6: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest