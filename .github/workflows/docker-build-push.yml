name: CI-CD Pipeline (Docker + Kubernetes)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # -------------------------------
  # JOB 1: BUILD & PUSH IMAGES
  # -------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: eureka-server
            image: vasta-eureka
          - service: auth-server
            image: vasta-auth
          - service: account-service
            image: vasta-account
          - service: user-service
            image: vasta-user
          - service: transaction-server
            image: vasta-transaction
          - service: notification-server
            image: vasta-notify
          - service: loan-server
            image: vasta-loan
          - service: kyc-service
            image: vasta-kyc
          - service: admin-server
            image: vasta-admin
          - service: Payment-gatway-server
            image: vasta-payment
          - service: api-gatway
            image: vasta-api-gateway
          - service: banking-frontend
            image: vasta-frontend

    steps:
      # -------------------------------
      # CHECKOUT
      # -------------------------------
      - uses: actions/checkout@v4

      # -------------------------------
      # AUTO VERSIONING (RUN ONCE ONLY)
      # -------------------------------
      - name: Get latest tag
        if: matrix.service == 'eureka-server'
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "LATEST_TAG=$TAG" >> $GITHUB_ENV

      - name: Increment version
        if: matrix.service == 'eureka-server'
        run: |
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH+1))
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create Git Tag
        if: matrix.service == 'eureka-server'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag $NEW_VERSION
          git push origin $NEW_VERSION

      # -------------------------------
      # SHARE VERSION TO ALL MATRIX JOBS
      # -------------------------------
      - name: Set default version (fallback)
        run: |
          if [ -z "$NEW_VERSION" ]; then
            echo "NEW_VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      # -------------------------------
      # BUILD JAVA SERVICES
      # -------------------------------
      - name: Setup JDK 17
        if: matrix.service != 'banking-frontend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Maven
        if: matrix.service != 'banking-frontend'
        run: mvn -B clean package -DskipTests

      # -------------------------------
      # DOCKER SETUP
      # -------------------------------
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------------
      # BUILD & PUSH DOCKER IMAGES
      # -------------------------------
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ env.NEW_VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}


  # -------------------------------
  # JOB 2: DEPLOY + TEST K8S
  # -------------------------------
  deploy-and-test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - uses: helm/kind-action@v1.8.0

      # -------------------------------
      # Install Optional Components
      # -------------------------------
      - name: Install Metrics Server (for HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml || true

      - name: Install OpenKruise (for CloneSet)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/openkruise/kruise/master/charts/kruise/crds/kruise_crds.yaml || true

      # -------------------------------
      # Namespace
      # -------------------------------
      - name: Create Namespace
        run: kubectl create namespace vasta || true

      # -------------------------------
      # Apply Resources (ORDERED)
      # -------------------------------
      - name: Apply Base Resources
        run: |
          kubectl apply -f K8s/namespace.yaml || true
          kubectl apply -f K8s/secret.yaml || true
          kubectl apply -f K8s/configmap.yaml || true

      - name: Apply Infra (DB / Kafka / Redis)
        run: |
          kubectl apply -f K8s/mysql.yaml || true
          kubectl apply -f K8s/redis.yaml || true
          kubectl apply -f K8s/kafka.yaml || true

      - name: Apply Core Services
        run: |
          kubectl apply -f K8s/eureka.yaml || true
          kubectl apply -f K8s/deployments/api-gateway.yaml || true

      - name: Apply Deployments Folder
        run: kubectl apply -f K8s/deployments/ || true

      - name: Apply Monitoring
        run: kubectl apply -f K8s/monitoring/ || true

      - name: Apply HPA
        run: kubectl apply -f K8s/hpa/ || true

      - name: Apply CloneSet
        run: kubectl apply -f K8s/cloneset/ || true

      # -------------------------------
      # WAIT FOR SYSTEM
      # -------------------------------
      - name: Wait for Pods Ready
        run: |
          echo "⏳ Waiting for pods..."

          for i in {1..30}; do
            NOT_READY=$(kubectl get pods -n vasta --no-headers 2>/dev/null | grep -v Running | wc -l)

            if [ "$NOT_READY" -eq 0 ]; then
              echo "✅ All pods running"
              break
            fi

            kubectl get pods -n vasta
            sleep 10
          done

      - name: Wait for Deployments
        run: |
          DEPLOYS=$(kubectl get deployments -n vasta -o jsonpath='{.items[*].metadata.name}')

          for d in $DEPLOYS; do
            echo "👉 $d"
            kubectl rollout status deployment/$d -n vasta --timeout=300s || exit 1
          done

      # -------------------------------
      # HEALTH CHECK (REAL TEST)
      # -------------------------------
      - name: API Gateway Health Check
        run: |
          kubectl port-forward svc/api-gateway 8080:8080 -n vasta &
          sleep 15
          curl -f http://localhost:8080/actuator/health

      # -------------------------------
      # CLUSTER SUMMARY
      # -------------------------------
      - name: Cluster Summary
        run: |
          kubectl get pods -n vasta -o wide
          kubectl get svc -n vasta
          kubectl get deploy -n vasta

      # -------------------------------
      # VALIDATION
      # -------------------------------
      - name: Validate Pods Health
        run: |
          NOT_READY=$(kubectl get pods -n vasta --no-headers | grep -v Running | wc -l)

          if [ "$NOT_READY" -gt 0 ]; then
            echo "❌ Some pods not running"
            kubectl get pods -n vasta
            exit 1
          fi

      # -------------------------------
      # DEBUG
      # -------------------------------
      - name: Debug Info
        run: |
          kubectl get pods -A -o wide
          kubectl get svc -A

      - name: Logs if failed
        if: failure()
        run: |
          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
            for pod in $(kubectl get pods -n $ns -o jsonpath='{.items[*].metadata.name}'); do
              echo "[$ns] $pod"
              kubectl logs -n $ns $pod --all-containers=true --tail=50 || true
            done
          done