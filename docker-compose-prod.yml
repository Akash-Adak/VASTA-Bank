version: "3.8"

services:

  # =========================
  # Zookeeper
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    expose:
      - "2181"

    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - vasta-network


  # =========================
  # Kafka
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always

    depends_on:
      zookeeper:
        condition: service_healthy

    expose:
      - "9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - vasta-network



  # =========================
  # Eureka Server
  # =========================
  eureka-server:
    image: akta2910/vasta-eureka:v1.0.8
    container_name: eureka-server
    restart: always

    expose:
      - "8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - vasta-network


  # =========================
  # API Gateway
  # =========================
  gateway-server:
    image: akta2910/vasta-api-gateway:v1.0.8
    container_name: apiGateway-server

    restart: always

    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    depends_on:
      eureka-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - vasta-network


  # =========================
  # Auth Service
  # =========================
  auth-service:
    image: akta2910/vasta-auth:v1.0.8
    container_name: auth-service

    restart: always

    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    expose:
      - "8081"

    depends_on:
     
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - vasta-network


  # =========================
  # User Service
  # =========================
  user-service:
    image: akta2910/vasta-user:v1.0.8
